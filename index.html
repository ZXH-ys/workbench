<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班主任工作台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#f06292',
            primaryLight: '#f8bbd0',
            primaryDark: '#c2185b',
            surface: '#f5f5f5',
            card: '#ffffff',
          },
          fontFamily: { sans: ['Noto Sans SC', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Noto Sans SC', sans-serif; }
    .sidebar-item:hover { background: rgba(240, 98, 146, 0.08); }
    .sidebar-item.active { background: linear-gradient(90deg, #f06292 0%, #f48fb1 100%); color: white; }
    .card-hover { transition: transform .15s, box-shadow .15s; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.08); }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    .fab { background: linear-gradient(135deg, #f06292 0%, #f48fb1 100%); box-shadow: 0 6px 18px rgba(240,98,146,.45); }
    .modal-bg { background: rgba(0,0,0,.35); backdrop-filter: blur(3px); }
    .tag-critic { background: #ffebee; color: #c62828; }
    .tag-praise { background: #fff8e1; color: #f9a825; }
    .tag-chat { background: #e3f2fd; color: #1565c0; }
    .empty-cell:hover { background: rgba(240,98,146,.06); }
    .course-card { background: rgba(240,98,146,.08); border-left: 3px solid #f06292; }

    /* ===== 深色模式 ===== */
    html.dark body { background:#15151f !important; color:#d0d0dc !important; }
    html.dark .bg-white { background:#222233 !important; }
    html.dark .bg-gray-50 { background:#1b1b29 !important; }
    html.dark .bg-gray-100 { background:#262638 !important; }
    html.dark header { background:rgba(34,34,51,.85) !important; }
    html.dark .text-gray-800 { color:#ececf4 !important; }
    html.dark .text-gray-700 { color:#ccccd8 !important; }
    html.dark .text-gray-600 { color:#a6a6b6 !important; }
    html.dark .text-gray-500 { color:#88889a !important; }
    html.dark .text-gray-400 { color:#6c6c80 !important; }
    html.dark .border-b, html.dark .border-t, html.dark .border { border-color:#33334a !important; }
    html.dark .border-primary { border-color:#f48fb1 !important; }
    html.dark .border-red-200, html.dark .border-red-300 { border-color:#ef9a9a !important; }
    html.dark input, html.dark textarea, html.dark select { background:#262638 !important; color:#ececf4 !important; border-color:#33334a !important; }
    html.dark .sidebar-item:hover { background: rgba(240,98,146,.18) !important; }
    html.dark .card-hover:hover { box-shadow:0 8px 24px rgba(0,0,0,.5); }
    html.dark { color-scheme: dark; }

    /* ===== 手机端适配 ===== */
    #menuBtn { display:none; }
    .menu-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:30; }
    .menu-backdrop.show { display:block; }
    @media (max-width: 768px) {
      #app { position:relative; }
      #app > aside { position:fixed; left:0; top:0; bottom:0; width:16rem; transform:translateX(-100%); transition:transform .25s ease; z-index:40; box-shadow:0 0 30px rgba(0,0,0,.35); }
      #app.nav-open > aside { transform:translateX(0); }
      #menuBtn { display:inline-flex; }
      #app > main { width:100%; }
    }

    /* ===== 撤销提示 ===== */
    .undo-toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); z-index:60; background:#2b2b3a; color:#fff; padding:10px 16px; border-radius:9999px; box-shadow:0 8px 24px rgba(0,0,0,.4); font-size:14px; display:flex; align-items:center; gap:12px; }
    .undo-toast button { background:#f06292; color:#fff; border:none; padding:4px 12px; border-radius:9999px; cursor:pointer; font-size:13px; }

    /* ===== 智能记录芯片 ===== */
    .qr-type, .qr-stu { padding:6px 14px; border-radius:9999px; font-size:13px; border:1px solid #e5e7eb; cursor:pointer; transition:all .15s; user-select:none; }
    .qr-off { background:#fff; color:#6b7280; }
    .qr-on { background:#f06292; color:#fff; border-color:#f06292; box-shadow:0 2px 8px rgba(240,98,146,.3); }
    .qr-stu.qr-on { background:#7c3aed; border-color:#7c3aed; }
  </style>
</head>
<body class="bg-surface text-gray-700 h-screen overflow-hidden">
  <div id="app" class="flex h-full"></div>
  <div class="menu-backdrop" onclick="toggleSidebar()"></div>
  <div id="modal-root"></div>
  <div id="undo-root"></div>
  <script src="app.js"></script>
</body>
</html>
