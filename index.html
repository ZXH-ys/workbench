<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>班主任工作台</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f06292">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="班主任台">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#f06292',
            primaryLight: '#f8bbd0',
            primaryDark: '#c2185b',
            surface: '#f5f5f5',
            card: '#ffffff',
          },
          fontFamily: { sans: ['Noto Sans SC', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Noto Sans SC', sans-serif; }
    .sidebar-item:hover { background: rgba(240, 98, 146, 0.08); }
    .sidebar-item.active { background: linear-gradient(90deg, #f06292 0%, #f48fb1 100%); color: white; }
    .card-hover { transition: transform .15s, box-shadow .15s; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.08); }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    .fab { background: linear-gradient(135deg, #f06292 0%, #f48fb1 100%); box-shadow: 0 6px 18px rgba(240,98,146,.45); }
    .modal-bg { background: rgba(0,0,0,.35); backdrop-filter: blur(3px); }
    .tag-critic { background: #ffebee; color: #c62828; }
    .tag-praise { background: #fff8e1; color: #f9a825; }
    .tag-chat { background: #e3f2fd; color: #1565c0; }
    .tag-leave { background: #fff3e0; color: #ef6c00; }

    .member-chip { display:inline-flex; align-items:center; padding:6px 14px; border-radius:9999px; font-size:14px; border:1px solid #e5e7eb; background:#fff; color:#374151; cursor:pointer; transition:all .15s; user-select:none; }
    .member-chip:hover { background:#f3f4f6; }
    .member-chip.home { background:#3b82f6; color:#fff; border-color:#3b82f6; }
    .member-chip.leave { background:#ef4444; color:#fff; border-color:#ef4444; }
    .member-chip.both { background:linear-gradient(90deg, #3b82f6 50%, #ef4444 50%); color:#fff; border:none; }
    .day-check { display:inline-flex; align-items:center; justify-content:center; min-width:30px; height:30px; padding:0 8px; border-radius:8px; border:1px solid #e5e7eb; background:#fff; color:#374151; cursor:pointer; user-select:none; font-size:13px; transition:all .15s; }
    .day-check:hover { background:#eff6ff; border-color:#93c5fd; }
    .day-check.selected { background:#3b82f6; color:#fff; border-color:#3b82f6; }
    .empty-cell:hover { background: rgba(240,98,146,.06); }
    .course-card { background: rgba(240,98,146,.08); border-left: 3px solid #f06292; transition: opacity .15s, transform .15s; }
    .course-card[draggable="true"] { cursor: grab; }
    .course-card[draggable="true"]:active { cursor: grabbing; }
    .course-card.opacity-50 { opacity: .5; }
    td.drag-over { background: rgba(240,98,146,.12) !important; outline: 2px dashed #f06292; outline-offset: -2px; }

    /* ===== 座次表 ===== */
    .seat-wrap { display:flex; flex-direction:column; gap:4px; }
    .seat-row { display:flex; align-items:stretch; gap:4px; }
    .seat-rownum { width:22px; display:flex; align-items:center; justify-content:center; font-size:11px; color:#9ca3af; flex-shrink:0; }
    .seat-colhead { flex:1; min-width:0; display:flex; align-items:center; justify-content:center; font-size:11px; color:#9ca3af; height:18px; }
    .seat-cell { flex:1; min-width:0; height:40px; display:flex; align-items:center; justify-content:center; border-radius:6px; border:1px solid; font-size:12px; cursor:pointer; transition:all .15s; user-select:none; }
    .seat-cell.seat-seat { font-weight:500; }
    .seat-cell.seat-seat:hover { transform:translateY(-1px); box-shadow:0 2px 6px rgba(240,98,146,.15); }
    .seat-empty { font-size:11px; }
    .seat-row.seat-header-row { margin:1px 0; }
    .seat-pending-chip { display:inline-flex; align-items:center; padding:4px 10px; border-radius:9999px; font-size:12px; border:1px solid #e5e7eb; background:#fff; color:#374151; cursor:pointer; transition:all .15s; user-select:none; }
    .seat-pending-chip:hover { background:#fdf2f8; border-color:#f06292; color:#f06292; }
    .seat-pending-chip[draggable="true"] { cursor:grab; }
    .seat-pending-chip[draggable="true"]:active { cursor:grabbing; }
    .seat-wrap .drag-over { background:rgba(240,98,146,.12) !important; outline:2px dashed #f06292; outline-offset:-2px; }

    /* ===== 深色模式 ===== */
    html.dark body { background:#15151f !important; color:#d0d0dc !important; }
    html.dark .bg-white { background:#222233 !important; }
    html.dark .bg-gray-50 { background:#1b1b29 !important; }
    html.dark .bg-gray-100 { background:#262638 !important; }
    html.dark header { background:rgba(34,34,51,.85) !important; }
    html.dark .text-gray-800 { color:#ececf4 !important; }
    html.dark .text-gray-700 { color:#ccccd8 !important; }
    html.dark .text-gray-600 { color:#a6a6b6 !important; }
    html.dark .text-gray-500 { color:#88889a !important; }
    html.dark .text-gray-400 { color:#6c6c80 !important; }
    html.dark .border-b, html.dark .border-t, html.dark .border { border-color:#33334a !important; }
    html.dark .border-primary { border-color:#f48fb1 !important; }
    html.dark .border-red-200, html.dark .border-red-300 { border-color:#ef9a9a !important; }
    html.dark input, html.dark textarea, html.dark select { background:#262638 !important; color:#ececf4 !important; border-color:#33334a !important; }
    html.dark .sidebar-item:hover { background: rgba(240,98,146,.18) !important; }
    html.dark .card-hover:hover { box-shadow:0 8px 24px rgba(0,0,0,.5); }
    html.dark .seat-cell.seat-seat { background:rgba(240,98,146,.12) !important; border-color:#f48fb1 !important; color:#f8bbd0 !important; }
    html.dark .seat-pending-chip { background:#222233 !important; border-color:#33334a !important; color:#ececf4 !important; }
    html.dark .seat-pending-chip:hover { background:rgba(240,98,146,.15) !important; border-color:#f48fb1 !important; color:#f8bbd0 !important; }
    html.dark { color-scheme: dark; }

    /* ===== 手机端适配 ===== */
    #menuBtn { display:none; }
    .menu-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:30; }
    .menu-backdrop.show { display:block; }
    @media (max-width: 768px) {
      #app { position:relative; }
      #app > aside { position:fixed; left:0; top:0; bottom:0; width:16rem; transform:translateX(-100%); transition:transform .25s ease; z-index:40; box-shadow:0 0 30px rgba(0,0,0,.35); }
      #app.nav-open > aside { transform:translateX(0); }
      #menuBtn { display:inline-flex; }
      #app > main { width:100%; }
    }

    /* ===== 撤销提示 ===== */
    .undo-toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); z-index:60; background:#2b2b3a; color:#fff; padding:10px 16px; border-radius:9999px; box-shadow:0 8px 24px rgba(0,0,0,.4); font-size:14px; display:flex; align-items:center; gap:12px; }
    .undo-toast button { background:#f06292; color:#fff; border:none; padding:4px 12px; border-radius:9999px; cursor:pointer; font-size:13px; }

    /* ===== 智能记录芯片 ===== */
    .qr-type, .qr-stu { padding:6px 14px; border-radius:9999px; font-size:13px; border:1px solid #e5e7eb; cursor:pointer; transition:all .15s; user-select:none; }
    .qr-off { background:#fff; color:#6b7280; }
    .qr-on { background:#f06292; color:#fff; border-color:#f06292; box-shadow:0 2px 8px rgba(240,98,146,.3); }
    .qr-stu.qr-on { background:#7c3aed; border-color:#7c3aed; }

    /* ===== 职务与值日管理 ===== */
    .pm-seg.active { background:#4f46e5; color:#fff; }
    .duty-cell{min-width:110px;vertical-align:top;padding:8px}
    .duty-cell .name-col{display:flex;flex-direction:column;align-items:center;gap:4px}
    .duty-cell .edit-toggle{font-size:11px;color:#64748b;cursor:pointer;margin-top:4px}
    .duty-cell .edit-toggle:hover{color:#4f46e5}
    .inline-input{border:1px solid #e2e8f0;border-radius:6px;padding:2px 6px;font-size:13px;width:72px}
    .inline-input:focus{outline:none;border-color:#4f46e5}
    .cell-edit{cursor:pointer}
    .cell-edit:hover{background:#eef2ff}
    .org-chart{display:flex;flex-direction:column;align-items:flex-start;padding:10px;min-width:max-content}
    .org-chart ul{padding-top:28px;position:relative;display:flex;justify-content:center;margin:0;list-style:none;min-width:max-content}
    .org-chart li{float:left;text-align:center;position:relative;padding:0 12px}
    .org-chart li::before,.org-chart li::after{content:'';position:absolute;top:0;right:50%;border-top:2px solid #94a3b8;width:50%;height:28px}
    .org-chart li::after{right:auto;left:50%;border-left:2px solid #94a3b8}
    .org-chart li:first-child::before{border:0 none}
    .org-chart li:last-child::after{border:0 none}
    .org-chart li:last-child::before{border-right:2px solid #94a3b8}
    .org-chart li:first-child::after{border-radius:0}
    .org-chart ul ul::before{content:'';position:absolute;top:0;left:50%;border-left:2px solid #94a3b8;width:0;height:28px}
    .org-chart li:only-child::after,.org-chart li:only-child::before{display:none}
    .org-chart li:only-child{padding-top:0}
    .org-node{display:inline-block;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:10px 16px;min-width:100px;max-width:240px;box-shadow:0 2px 8px rgba(0,0,0,.05);position:relative;z-index:1;cursor:grab;transition:.15s}
    .org-node:active{cursor:grabbing}
    .org-node.drag-over{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.18)}
    .org-node .title{font-weight:700;font-size:15px;color:#1e293b;line-height:1.3}
    .org-node .names{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px}
    .org-node .names .name-chip{font-size:12px;background:#eef2ff;color:#4f46e5;padding:2px 8px;border-radius:999px;white-space:nowrap}
    .org-node .names .more{font-size:11px;color:#94a3b8}
    .org-node.root{background:#4f46e5;border-color:#4f46e5}
    .org-node.root.empty{background:#4f46e5;border-style:solid;border-color:#4f46e5}
    .org-node.root .title{color:#fff}
    .org-node.root.empty .title{color:#fff}
    .org-node.root.empty .org-empty{color:#cbd5e1}
    .org-node.branch{background:#eef2ff;border-color:#c7d2fe}
    .org-node.branch .title{color:#4338ca}
    .org-node.leaf{background:#f8fafc}
    .org-node.empty{background:#fff;border-style:dashed;border-color:#cbd5e1}
    .org-empty{color:#94a3b8;font-size:12px;padding:2px 0}
    .free-zone{margin-top:24px;padding:16px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:14px}
    .free-zone-title{font-size:13px;color:#64748b;margin-bottom:10px}
    .free-list{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
    .free-node{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:8px 14px;cursor:grab;box-shadow:0 1px 4px rgba(0,0,0,.05);font-size:13px;font-weight:600;color:#334155}
    .free-node:hover{border-color:#4f46e5}
    .drop-target{min-height:40px;border:2px dashed transparent;border-radius:14px;padding:8px;transition:.15s}
    .drop-target.drag-over{border-color:#4f46e5;background:#eef2ff}
    html.dark .pm-seg.active { background:#6366f1; color:#fff; }
    html.dark .org-node{background:#222233;border-color:#33334a}
    html.dark .org-node .title{color:#ececf4}
    html.dark .org-node.branch{background:#26263f;border-color:#3a3a5c}
    html.dark .org-node.branch .title{color:#c7d2fe}
    html.dark .org-node.leaf{background:#222233}
    html.dark .org-node .names .name-chip{background:#312e81;color:#c7d2fe}
    html.dark .org-node.root{background:#4f46e5;border-color:#6366f1}
    html.dark .org-node.empty{background:#222233;border-color:#3a3a5c}
    html.dark .free-zone{background:#1b1b29;border-color:#33334a}
    html.dark .free-zone-title{color:#88889a}
    html.dark .free-node{background:#222233;border-color:#33334a;color:#ececf4}
    html.dark .free-node:hover{border-color:#6366f1}
    html.dark .org-chart li::before,html.dark .org-chart li::after,html.dark .org-chart ul ul::before{border-color:#3a3a5c}

    /* ===== 大屏 / 智慧屏幕适配（投影给学生看） ===== */
    @media (min-width: 1600px) {
      body { font-size: 17px; }
      #main-content { padding: 2rem 2.5rem !important; }
    }
    @media (min-width: 2200px) {
      body { font-size: 20px; }
      #main-content { padding: 3rem 4rem !important; }
      .text-2xl { font-size: 1.75rem; }
    }
    /* ===== 手机端微调 ===== */
    @media (max-width: 768px) {
      #main-content { padding: 1rem !important; padding-bottom: 6rem !important; }
      header { padding-left: 1rem !important; padding-right: 1rem !important; }
      .fab { bottom: calc(1rem + env(safe-area-inset-bottom)); right: 1rem; width: 3.5rem; height: 3.5rem; font-size: 1.5rem; }
      /* 弹窗铺满：手机上一句话记录要当「随手记」用，半屏弹窗会被键盘挤没 */
      .modal-bg { align-items: stretch !important; padding: 0 !important; }
      .modal-bg > div {
        margin: 0; border-radius: 0; width: 100%; max-width: 100%;
        /* dvh 会随软键盘收起/弹出而变化；第一行是老浏览器（iOS 15.4 以下）的兜底 */
        height: 100%; max-height: 100vh;
        height: 100dvh; max-height: 100dvh;
        padding-bottom: env(safe-area-inset-bottom);
      }
      .modal-bg > div > .p-6 { padding: 1rem !important; }
      /* 吸顶区用负外边距铺满宽度，手机端内边距是 1rem，要跟着改 */
      .qr-sticky { margin-left: -1rem; margin-right: -1rem; padding-left: 1rem; padding-right: 1rem; }
      /* iOS 上字号小于 16px 的输入框被聚焦时会自动放大页面，必须锁 16px */
      .modal-bg textarea, .modal-bg input, .modal-bg select { font-size: 16px !important; }
      /* 触控目标不小于 44px（Apple HIG），免得点不准 */
      .qr-tap { min-height: 44px; }
      .qr-tap-sm { min-height: 36px; }
      /* 班级手册的条目操作按钮（↑ ↓ ✏️ 🗑️）：手机上放大到 36×32，避免误触 */
      .hb-tap { min-height: 36px; min-width: 32px; display: inline-flex; align-items: center; justify-content: center; }
    }
    /* 班级手册：长文本按原样换行显示（用户可能一条里写了多行） */
    .hb-text { white-space: pre-wrap; word-break: break-word; }
    /* 一句话记录：输入框与状态条吸在顶部，识别结果在下方独立滚动 */
    .qr-sticky { position: sticky; top: 0; z-index: 2; background: #fff; }
    html.dark .qr-sticky { background: #1b1b29; }
    .qr-more summary, .qr-hint summary { list-style: none; cursor: pointer; }
    .qr-more summary::-webkit-details-marker, .qr-hint summary::-webkit-details-marker { display: none; }

    /* ===== 家长群截图版报告 ===== */
    .report-parent { font-size: 1.05rem; padding: 1.5rem !important; }
    .report-parent .text-sm { font-size: 1rem; }
    .report-parent .text-xs { font-size: 0.9rem; }
    .report-parent .text-lg { font-size: 1.25rem; }
    .report-parent .text-xl,
    .report-parent .text-2xl { font-size: 1.5rem; }
    @media (min-width: 1200px) {
      .report-parent { font-size: 1.15rem; }
      .report-parent .text-2xl { font-size: 1.75rem; }
    }
  </style>
</head>
<body class="bg-surface text-gray-700 h-screen overflow-hidden">
  <div id="app" class="flex h-full"></div>
  <div class="menu-backdrop" onclick="toggleSidebar()"></div>
  <div id="modal-root"></div>
  <div id="undo-root"></div>
  <!-- 版本号：每次发布递增，强制浏览器/Service Worker 拉取新代码，避免缓存导致看不到修复 -->
  <script src="app.js?v=20260831g"></script>
</body>
</html>
